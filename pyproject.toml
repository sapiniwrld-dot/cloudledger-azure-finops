[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudledger-azure-finops"
version = "0.1.0"
description = "Azure cost data validation and FinOps analytics"
requires-python = ">=3.14"

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
cloudledger = "cloudledger.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

